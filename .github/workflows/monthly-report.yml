name: Monthly Recap Report

on:
  schedule:
    - cron: "0 12 1-7 * 1-5"   # 8 AM EDT, days 1–7 of the month, Mon–Fri only
  workflow_dispatch:              # Run manually from GitHub for testing
    inputs:
      force_run:
        description: "Run even if today isn't the first business day of the month"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run monthly recap report
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_APP_PASSWORD: ${{ secrets.OUTLOOK_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: python reports/monthly_report.py
