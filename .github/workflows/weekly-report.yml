name: Weekly Brand Intelligence Report

on:
  schedule:
    - cron: "0 12 * * 5"   # Every Friday 8 AM EDT (UTC-4, New York summer time)
  workflow_dispatch:         # Run manually from GitHub for testing

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run weekly brand report
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python reports/weekly_report.py
